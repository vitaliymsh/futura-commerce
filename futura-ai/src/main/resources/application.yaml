server:
  port: 8087
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: futura-ai
  datasource:
    url: jdbc:mysql://localhost:3307/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379

ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:ollama}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:qwen3-vl:4b}
    embed-model: ${OLLAMA_EMBED_MODEL:qwen3-vl:4b}
    connect-timeout-ms: 3000
    read-timeout-ms: 10000

jwt:
  secret: futura-ai-internal-service-secret-key-2026
  expiration: 86400000
  tokenHeader: Authorization
